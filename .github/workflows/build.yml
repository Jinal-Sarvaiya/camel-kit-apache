name: Build

on:
  push:
    branches:
      - main
      - release
      - 'release/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# Least-privilege default token; the build job only reads the repo. The comment-pr
# job raises its own scope to pull-requests: write.
permissions:
  contents: read

jobs:
  build:
    name: Build and Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [21, 25]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Test release boundaries and distribution mirrors
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Check code formatting and imports
        run: ./mvnw -B -Psourcecheck validate

      - name: Build and certify Ship payloads
        run: ./mvnw -B -V -Plinux-ship-certification -Dformat.skip=true -Deval.requireVectors=true clean install

      - name: Upload build artifacts
        if: success() && matrix.java == '21'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifacts-java${{ matrix.java }}-${{ github.sha }}
          path: |
            kit/camel-kit-main/target/*.jar
            kit/camel-kit-core/target/*.jar
            knowledge/mcp/target/*-runner.jar
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-java${{ matrix.java }}-${{ github.sha }}
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7

  cli-compatibility:
    name: CLI compatibility (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-java@v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Verify token binding, host discovery, redirected output and generated command prefixes
        shell: bash
        run: |
          ./mvnw -B -pl kit/camel-jbang-plugin-kit -am install -DskipTests
          ./mvnw -B -pl kit/camel-kit-core,kit/camel-jbang-plugin-kit test -Dgroups=cli-compat -DfailIfNoTests=true
      - name: Upload CLI compatibility results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-results-${{ matrix.os }}-java${{ matrix.java }}-${{ github.sha }}
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  comment-pr:
    name: Comment PR Status
    runs-on: ubuntu-latest
    needs: [build, cli-compatibility]
    # Fork PRs run with a read-only GITHUB_TOKEN, so posting the comment would 403.
    if: github.event_name == 'pull_request' && always() && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with build status
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const buildResult = '${{ needs.build.result }}';
            const compatibilityResult = '${{ needs.cli-compatibility.result }}';
            const success = buildResult === 'success' && compatibilityResult === 'success';
            const emoji = success ? '✅' : '❌';

            const message = `${emoji} Build checks for commit ${context.payload.pull_request.head.sha.substring(0, 7)}

            **Java 21 and 25:**
            Linux build and tests: ${buildResult}
            macOS/Windows CLI compatibility: ${compatibilityResult}

            ${success ? 'Build artifacts are available in the workflow run.' : `Please check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
