openapi: 3.0.1
info:
  title: Order API
  version: 1.0.0
  description: Sample OpenAPI specification for testing interface contract discovery
servers:
  - url: https://api.example.com/v1
paths:
  /orders:
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
components:
  schemas:
    Order:
      type: object
      required:
        - orderId
        - customerId
        - totalAmount
      properties:
        orderId:
          type: string
          description: Unique order identifier
        customerId:
          type: string
          description: Customer identifier
        totalAmount:
          type: number
          format: double
          description: Total order amount
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
        quantity:
          type: integer
        price:
          type: number
    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, processing]
        createdAt:
          type: string
          format: date-time
